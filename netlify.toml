[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://blinklinknet.netlify.app/*"
  to = "https://blink.linzaapps.duckdns.org/:splat"
  status = 301
  force = true


[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/container/*"
  to = "/c/:splat"
  status = 301

[[redirects]]
  from = "/profile/*"
  to = "/u/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
